name: Android ARMv7 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;4.3.2" "ndk;29.0.14206865"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Check vcpkg triplets
        run: |
          $VCPKG_ROOT/vcpkg help triplet | head -50
          ls "$VCPKG_ROOT/triplets" | grep android
      - name: Build dependencies
        run: |
          ABI=armeabi-v7a
          cmake -B build-android-$ABI \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=arm-android \
            -DVCPKG_CMAKE_SYSTEM_VERSION=24 \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build APK
        working-directory: android
        run: |
          sed -i "s/abiFilters 'arm64-v8a'/abiFilters 'armeabi-v7a'/" app/build.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PvZ-Portable-ARMv7
          path: android/app/build/outputs/apk/release/*.apk
